<!-- ============ 1. CSS: вставьте в конец <style> (перед </style>) ============ -->
<style>
  /* GALLERY */
  .gallery{overflow:hidden;padding:36px 0 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .gallery-track{display:flex;width:max-content;animation:gal-move 50s linear infinite;will-change:transform}
  .gallery-track img{width:270px;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;flex-shrink:0;margin-right:14px}
  @keyframes gal-move{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (hover:hover){.gallery:hover .gallery-track{animation-play-state:paused}}
  @media (max-width:820px){
    .gallery{padding-top:24px}
    .gallery-track{animation-duration:42s}
    .gallery-track img{width:64vw;max-width:290px;margin-right:10px}
  }
  @media (prefers-reduced-motion:reduce){.gallery-track{animation:none}.gallery{overflow-x:auto}}
</style>

<!-- ============ 2. HTML: замените весь блок <section id="intro"> ... </section> ============ -->
<section class="block noline" id="intro" style="padding-bottom:40px">
  <div class="gallery" aria-label="Фотографии квартиры">
    <div class="gallery-track" id="galTrack">
      <img src="/books/gallery/flat-1.webp" alt="Гостиная с окном" width="900" height="1200" loading="eager">
      <img src="/books/gallery/flat-2.webp" alt="Гостиная и кухня" width="900" height="1200" loading="eager">
      <img src="/books/gallery/flat-3.webp" alt="Спальня" width="900" height="1200" loading="lazy">
      <img src="/books/gallery/flat-4.webp" alt="Рабочая зона с ТВ" width="900" height="1200" loading="lazy">
      <img src="/books/gallery/flat-5.webp" alt="Изголовье кровати" width="900" height="1200" loading="lazy">
      <img src="/books/gallery/flat-6.webp" alt="Ванная комната" width="900" height="1200" loading="lazy">
    </div>
  </div>
</section>

<!-- ============ 3. JS: вставьте перед </body> (внутри любого <script>) ============ -->
<script>
  (function(){
    var t=document.getElementById('galTrack'); if(!t) return;
    Array.prototype.slice.call(t.children).forEach(function(img){
      var c=img.cloneNode(true); c.setAttribute('aria-hidden','true'); c.alt=''; c.loading='lazy'; t.appendChild(c);
    });
  })();
</script>
